<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(13, 148, 136, 0.4)" />
      <stop offset="100%" stop-color="rgba(16, 185, 129, 0.05)" />
    </linearGradient>
  </defs>
  
  <!-- Outer glow background circle -->
  <circle cx="250" cy="250" r="220" fill="url(#glowGrad)" filter="blur(10px)" opacity="0.4" />
  
  <!-- Background grid pattern -->
  <g opacity="0.15">
    <line x1="50" y1="250" x2="450" y2="250" stroke="#0d9488" stroke-width="1" stroke-dasharray="5 5" />
    <line x1="250" y1="50" x2="250" y2="450" stroke="#0d9488" stroke-width="1" stroke-dasharray="5 5" />
    <circle cx="250" cy="250" r="160" stroke="#0d9488" stroke-width="1" fill="none" stroke-dasharray="4 4" />
    <circle cx="250" cy="250" r="100" stroke="#0d9488" stroke-width="1" fill="none" stroke-dasharray="2 2" />
  </g>
  
  <!-- Medical pulses / waves -->
  <path d="M 50 350 Q 100 300 150 350 T 250 350 T 350 350 T 450 350" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2" />
  <path d="M 50 365 Q 110 330 170 365 T 290 365 T 410 365" fill="none" stroke="rgba(13, 148, 136, 0.3)" stroke-width="1.5" />
  
  <!-- Stylized Nephron / Kidney outline -->
  <g transform="translate(140, 110)">
    <!-- Right Kidney Half -->
    <path d="M110,20 C180,20 220,100 200,170 C180,240 130,260 110,260 C90,260 85,210 95,170 C105,130 90,90 85,70 C80,50 90,20 110,20 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
          
    <!-- Left Kidney Half -->
    <path d="M110,20 C40,20 0,100 20,170 C40,240 90,260 110,260 C130,260 135,210 125,170 C115,130 130,90 135,70 C140,50 130,20 110,20 Z" 
          fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" />
          
    <!-- Arteries and Veins (Red/Blue stylized lines for oxygenated/deoxygenated blood) -->
    <!-- Renal Artery (Red-ish Teal) -->
    <path d="M 110 140 C 70 140 50 160 30 150" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <path d="M 110 150 C 65 155 45 175 25 170" fill="none" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
    
    <!-- Internal Network (Connecting lines & nodes representing medical tech) -->
    <g stroke="rgba(13, 148, 136, 0.6)" stroke-width="1.5">
      <line x1="110" y1="50" x2="140" y2="80" />
      <line x1="140" y1="80" x2="130" y2="130" />
      <line x1="130" y1="130" x2="160" y2="160" />
      <line x1="160" y1="160" x2="150" y2="210" />
      <line x1="110" y1="230" x2="150" y2="210" />
      
      <!-- Nodes -->
      <circle cx="110" cy="50" r="5" fill="#10b981" />
      <circle cx="140" cy="80" r="4" fill="#0d9488" />
      <circle cx="130" cy="130" r="5" fill="#10b981" />
      <circle cx="160" cy="160" r="4" fill="#ffffff" stroke="#0d9488" stroke-width="2" />
      <circle cx="150" cy="210" r="6" fill="#10b981" />
      <circle cx="110" cy="230" r="5" fill="#0d9488" />
    </g>
  </g>
  
  <!-- Floating elements -->
  <g>
    <!-- Capsules/Pills mockups -->
    <g transform="translate(80, 100) rotate(15)" opacity="0.8">
      <rect x="0" y="0" width="30" height="14" rx="7" fill="#0d9488" />
      <rect x="15" y="0" width="15" height="14" rx="7" fill="#10b981" />
    </g>
    <g transform="translate(380, 280) rotate(-25)" opacity="0.8">
      <rect x="0" y="0" width="24" height="12" rx="6" fill="#0f172a" />
      <rect x="12" y="0" width="12" height="12" rx="6" fill="#0d9488" />
    </g>
  </g>
</svg>
