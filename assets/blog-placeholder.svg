<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="blogGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="400" height="250" fill="url(#blogGrad)" />
  
  <!-- Biological helix / connection network representing research -->
  <g stroke="rgba(16, 185, 129, 0.25)" stroke-width="1.5" fill="none">
    <path d="M 50 125 C 100 75 150 75 200 125 C 250 175 300 175 350 125" />
    <path d="M 50 125 C 100 175 150 175 200 125 C 250 75 300 75 350 125" />
    
    <!-- Vertical connecting bars -->
    <line x1="80" y1="102" x2="80" y2="148" />
    <line x1="110" y1="92" x2="110" y2="158" />
    <line x1="140" y1="95" x2="140" y2="155" />
    <line x1="170" y1="110" x2="170" y2="140" />
    <line x1="230" y1="140" x2="230" y2="110" />
    <line x1="260" y1="155" x2="260" y2="95" />
    <line x1="290" y1="158" x2="290" y2="92" />
    <line x1="320" y1="148" x2="320" y2="102" />
  </g>
  
  <!-- Circles / Nodes of DNA structure -->
  <g fill="url(#accentGrad)">
    <circle cx="80" cy="102" r="4" />
    <circle cx="80" cy="148" r="4" />
    <circle cx="110" cy="92" r="4" fill="#ffffff" />
    <circle cx="110" cy="158" r="4" />
    <circle cx="140" cy="95" r="4" />
    <circle cx="140" cy="155" r="4" fill="#ffffff" />
    <circle cx="260" cy="95" r="4" fill="#ffffff" />
    <circle cx="260" cy="155" r="4" />
    <circle cx="290" cy="92" r="4" />
    <circle cx="290" cy="158" r="4" fill="#ffffff" />
  </g>
  
  <!-- Microscope / scientific vector shape on left -->
  <g transform="translate(40, 60)" stroke="#10b981" stroke-width="2" fill="none" opacity="0.6">
    <path d="M10,80 A30,30 0 0,1 40,50 L40,30" />
    <rect x="35" y="15" width="10" height="15" rx="2" fill="#10b981" />
    <line x1="25" y1="80" x2="55" y2="80" stroke-width="3" />
    <circle cx="25" cy="50" r="3" fill="#0d9488" />
  </g>
  
  <!-- Research document icon in the center -->
  <g transform="translate(160, 65)">
    <!-- Shield/Document background -->
    <rect x="0" y="0" width="80" height="100" rx="6" fill="#1e293b" stroke="#0d9488" stroke-width="2" />
    <!-- Pulse Line -->
    <path d="M 15 50 L 30 50 L 35 30 L 42 70 L 48 45 L 53 55 L 65 50" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Lines -->
    <line x1="15" y1="15" x2="65" y2="15" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="15" y1="23" x2="45" y2="23" stroke="rgba(255, 255, 255, 0.4)" stroke-width="3" stroke-linecap="round" />
    
    <line x1="15" y1="80" x2="65" y2="80" stroke="rgba(13, 148, 136, 0.4)" stroke-width="2" stroke-linecap="round" />
    <line x1="15" y1="86" x2="50" y2="86" stroke="rgba(13, 148, 136, 0.4)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
