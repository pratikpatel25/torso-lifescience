<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 110" width="520" height="110">
  <defs>
    <!-- 3D Blue Gradient for the Left Pill Half -->
    <linearGradient id="blue-grad" x1="15%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#1d75bc" />
      <stop offset="45%" stop-color="#155d96" />
      <stop offset="100%" stop-color="#0b3c66" />
    </linearGradient>
    
    <!-- 3D Red Gradient for the Right Pill Half -->
    <linearGradient id="red-grad" x1="15%" y1="0%" x2="55%" y2="100%">
      <stop offset="0%" stop-color="#e2533a" />
      <stop offset="45%" stop-color="#ba3520" />
      <stop offset="100%" stop-color="#821113" />
    </linearGradient>
  </defs>
  
  <!-- Pill Left Half (Blue) with Custom Cutout Path -->
  <path d="M 130,15 L 60,15 A 40,40 0 0,0 60,95 L 114,95 L 114,58 A 6,6 0 0,0 108,52 L 91,52 A 6,6 0 0,1 85,46 L 85,41 A 6,6 0 0,1 91,35 L 130,35 Z" fill="url(#blue-grad)" />
  
  <!-- Pill Right Half (Red) with Custom Cutout Path -->
  <path d="M 130,15 L 200,15 A 40,40 0 0,1 200,95 L 146,95 L 146,58 A 6,6 0 0,0 152,52 L 169,52 A 6,6 0 0,1 175,46 L 175,41 A 6,6 0 0,1 169,35 L 130,35 Z" fill="url(#red-grad)" />
  
  <!-- Text: TORSO -->
  <text x="260" y="72" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="58" font-weight="700" fill="#0b4c80" letter-spacing="0">TORSO</text>
  
  <!-- Text: LIFESCIENCES -->
  <text x="264" y="93" font-family="'Outfit', 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="19" font-weight="400" fill="#5c6670" letter-spacing="8">LIFESCIENCES</text>
</svg>
